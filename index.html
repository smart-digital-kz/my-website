<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найриятқа арнау ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap');

        body {
            margin: 0;
            background: #1a0f0f; /* Lou Lou стиліндегі терең қызыл/қара реңк */
            color: #f4e4d7;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            padding: 40px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            background: rgba(40, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            max-width: 500px;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #d4af37; /* Алтын түс */
            margin-bottom: 10px;
        }

        p { font-size: 1.2rem; line-height: 1.6; margin-bottom: 30px; }

        .date {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            margin-bottom: 30px;
        }

        .btn {
            background: #d4af37;
            color: #1a0f0f;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: #fff; transform: scale(1.05); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Найрият ✨</h1>
    <p>Сені "Lou Lou"-дың ерекше атмосферасында кездесуге шақырғым келеді.</p>
    <div class="date">07.06.2026</div>
    <p>Бұл кеш тек біз үшін болады.</p>
    <button class="btn" onclick="alert('Найрият, жауабыңды күтемін! ❤️')">Келісемін!</button>
</div>

</body>
</html>
